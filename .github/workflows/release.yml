name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.0' # 安定版のQt6を指定
          host: ${{ matrix.os == 'windows-latest' && 'windows' || 'mac' }}
          target: 'desktop'
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || 'clang_64' }}

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          # windeployqtで依存DLLを収集
          windeployqt --qmldir ui build/Release/EngineeringSupporter.exe
          # Updater.exe も同梱する
          cp build/Release/Updater.exe build/Release/
          # 実行ファイルをリネームして配布用に
          powershell Compress-Archive -Path build/Release/* -DestinationPath EngineeringSupporter-Windows.zip

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          # 実行ファイルの生成場所を確認
          find build -name "*.app"
          
          # macdeployqt でパッケージング
          macdeployqt build/Release/EngineeringSupporter.app -qmldir=ui -dmg -no-plugins || macdeployqt build/EngineeringSupporter.app -qmldir=ui -dmg -no-plugins
          
          # 成果物の移動
          mv build/Release/EngineeringSupporter.dmg EngineeringSupporter-macOS.dmg || mv build/EngineeringSupporter.dmg EngineeringSupporter-macOS.dmg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            EngineeringSupporter-Windows.zip
            EngineeringSupporter-macOS.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            windows-latest-build/EngineeringSupporter-Windows.zip
            macos-latest-build/EngineeringSupporter-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
