name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.0' # 安定版のQt6を指定
          host: ${{ matrix.os == 'windows-latest' && 'windows' || 'mac' }}
          target: 'desktop'
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || 'clang_64' }}

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release
          echo "Listing all files in build directory to debug:"
          find build -maxdepth 5

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          # windeployqtで依存DLLを収集
          windeployqt --qmldir ui build/Release/EngineeringSupporter.exe
          # Updater.exe も同梱する
          cp build/Release/Updater.exe build/Release/
          # 実行ファイルをリネームして配布用に
          powershell Compress-Archive -Path build/Release/* -DestinationPath EngineeringSupporter-Windows.zip

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          # 実行ファイルの生成場所を徹底的に確認
          find build -name "*.app" -maxdepth 4
          
          # 生成された.appのパスを取得
          APP_PATH=$(find build -name "EngineeringSupporter.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: EngineeringSupporter.app not found!"
            exit 1
          fi

          # macdeployqt でパッケージング
          macdeployqt "$APP_PATH" -qmldir=ui -dmg -no-plugins
          
          # dmgファイルの場所を探して移動
          DMG_PATH=$(find build -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            mv "$DMG_PATH" EngineeringSupporter-macOS.dmg
          else
            # macdeployqtがカレントディレクトリに出力した場合
            mv EngineeringSupporter.dmg EngineeringSupporter-macOS.dmg || echo "DMG not found in current dir"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            EngineeringSupporter-Windows.zip
            EngineeringSupporter-macOS.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            windows-latest-build/EngineeringSupporter-Windows.zip
            macos-latest-build/EngineeringSupporter-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
