name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.0' # 安定版のQt6を指定
          host: ${{ matrix.os == 'windows-latest' && 'windows' || 'mac' }}
          target: 'desktop'
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || 'clang_64' }}

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          # windeployqtで依存DLLを収集
          windeployqt --qmldir ui build/Release/EngineeringSupporter.exe
          # 実行ファイルをリネームして配布用に
          powershell Compress-Archive -Path build/Release/* -DestinationPath EngineeringSupporter-Windows.zip

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          # 実行ファイルのパスを取得（.app形式を優先）
          APP_PATH=$(find build -name "EngineeringSupporter.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            # バイナリ形式で生成された場合のフォールバック
            BINARY_PATH=$(find build -name "EngineeringSupporter" -type f -not -path "*/CMakeFiles/*" | head -n 1)
            if [ -n "$BINARY_PATH" ]; then
              mkdir -p build/EngineeringSupporter.app/Contents/MacOS
              mkdir -p build/EngineeringSupporter.app/Contents/Resources
              cp "$BINARY_PATH" build/EngineeringSupporter.app/Contents/MacOS/
              APP_PATH="build/EngineeringSupporter.app"
              
              # 最小限の Info.plist を作成
              printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n    <key>CFBundleExecutable</key>\n    <string>EngineeringSupporter</string>\n    <key>CFBundleIdentifier</key>\n    <string>com.ryokugyoku.EngineeringSupporter</string>\n    <key>CFBundleName</key>\n    <string>EngineeringSupporter</string>\n    <key>CFBundlePackageType</key>\n    <string>APPL</string>\n    <key>CFBundleShortVersionString</key>\n    <string>1.0.0</string>\n    <key>LSMinimumSystemVersion</key>\n    <string>10.15</string>\n</dict>\n</plist>' > build/EngineeringSupporter.app/Contents/Info.plist
            else
              echo "ERROR: EngineeringSupporter target not found!"
              exit 1
            fi
          fi

          # 拡張属性（検疫フラグや中途半端な署名）を削除して「完全に署名なし」の状態にする
          find "$APP_PATH" -type f -exec xattr -c {} \;

          # macdeployqt でパッケージング
          macdeployqt "$APP_PATH" -qmldir=ui -dmg -no-plugins
          
          # dmgファイルの移動
          find . -name "*.dmg" -exec mv {} EngineeringSupporter-macOS.dmg \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            EngineeringSupporter-Windows.zip
            EngineeringSupporter-macOS.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            windows-latest-build/EngineeringSupporter-Windows.zip
            macos-latest-build/EngineeringSupporter-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
